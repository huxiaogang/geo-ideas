<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>正式页检查</title></head>
<body><pre id="out">running...</pre>
<script>
window.__ERRS = [];
window.addEventListener('error', function (e) { window.__ERRS.push(e.message); });
</script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="../assets/js/md.js"></script>
<script src="../assets/js/geo.js"></script>
<script src="../assets/js/figures.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../content/meta.js"></script>
<script src="../content/tags.js"></script>
<script src="../content/ideas.js"></script>
<script src="../content/methods.js"></script>
<script src="../content/patterns.js"></script>
<script src="../content/problems.js"></script>
<script src="../assets/js/pages.js"></script>
<script>
(function () {
  const L = [];
  function log(s) { L.push(s); document.getElementById('out').textContent = L.join('\n'); }
  setTimeout(function () {
    log('katex=' + (!!window.katex));
    log('Geo=' + (window.Geo ? Object.keys(window.Geo.registry).length : 'MISSING'));
    log('MD=' + (!!window.MD));
    log('Store=' + (!!window.Store));
    log('App=' + (!!window.App));
    log('META=' + (!!window.META));
    log('TAGS=' + (window.TAGS ? window.TAGS.length : 0));
    log('IDEAS=' + (window.IDEAS ? window.IDEAS.length : 0));
    log('METHODS=' + (window.METHODS ? window.METHODS.length : 0));
    log('PATTERNS=' + (window.PATTERNS ? window.PATTERNS.length : 0));
    log('PROBLEMS=' + (window.PROBLEMS ? window.PROBLEMS.length : 0));
    log('CARDS=' + (window.App ? window.App.DB.cards.length : 0));
    log('PAGES=' + (window.App ? Object.keys(window.App.Pages).length : 0));
    const v = document.getElementById('view');
    log('VIEW=' + (v ? v.innerHTML.replace(/<[^>]+>/g, '').trim().length : 'NO VIEW'));
    log('TITLE=' + document.title);
    log('ERRORS=' + window.__ERRS.length + (window.__ERRS.length ? ' :: ' + window.__ERRS.join(' | ') : ''));
    document.title = 'INDEX_' + window.__ERRS.length;
  }, 300);
})();
</script>
</body></html>
